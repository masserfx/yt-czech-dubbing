<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1411"/>
      <stop offset="100%" stop-color="#040605"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="58%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#10b981" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="emerald" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#a7f3d0"/>
      <stop offset="45%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="ringStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.25"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <!-- iOS-style squircle background -->
  <rect x="0" y="0" width="1024" height="1024" rx="232" ry="232" fill="url(#bg)"/>

  <!-- Emerald halo glow -->
  <rect x="0" y="0" width="1024" height="1024" rx="232" ry="232" fill="url(#halo)"/>

  <!-- Concentric aura rings -->
  <g fill="none" stroke="url(#ringStroke)" stroke-linecap="round">
    <circle cx="512" cy="512" r="408" stroke-width="3" opacity="0.35"/>
    <circle cx="512" cy="512" r="346" stroke-width="3" opacity="0.55"/>
    <circle cx="512" cy="512" r="284" stroke-width="3" opacity="0.75"/>
  </g>

  <!-- Soft glow behind A -->
  <g filter="url(#softGlow)" opacity="0.65">
    <path d="M 512 222
             L 760 818
             L 654 818
             L 596 678
             L 428 678
             L 370 818
             L 264 818 Z
             M 468 580
             L 556 580
             L 512 408 Z"
          fill="#10b981" fill-rule="evenodd"/>
  </g>

  <!-- Letter A — bold, emerald gradient -->
  <path d="M 512 222
           L 760 818
           L 654 818
           L 596 678
           L 428 678
           L 370 818
           L 264 818 Z
           M 468 580
           L 556 580
           L 512 408 Z"
        fill="url(#emerald)" fill-rule="evenodd"/>

  <!-- Subtle inner border highlight (depth) -->
  <rect x="2" y="2" width="1020" height="1020" rx="230" ry="230"
        fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2"/>
</svg>
